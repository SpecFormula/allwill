  :root {

const sound = (() => {
  let ctx = null, master = null, musicGain = null, timer = null, nextTime = 0, step = 0;
  let muted = false;
  try { muted = localStorage.getItem("org-island-muted") === "1"; } catch {}

  const CHORDS = [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]];
  const ARP = [0, 1, 2, 1, 3, 2, 1, 2]; // 3＝高八度的根音
  function init() {

    master = ctx.createGain();

    o.type = type; o.frequency.value = freq; o.detune.value = detune;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(out);
    o.start(t); o.stop(t + dur + 0.05);
    return o;
  }
  function pluck(freq, t, gain = 0.16, out = musicGain) {

    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(out);
    src.start(t); src.stop(t + dur + 0.05);
  }
  function schedule() {
    while (nextTime < ctx.currentTime + 0.25) {
      const bar = Math.floor(step / 8) % 4, i = step % 8;
      const chord = CHORDS[bar];
      const n = ARP[i] === 3 ? chord[0] + 12 : chord[ARP[i]];
      if (!(i === 7 && bar % 2 === 1)) pluck(N(n + 12), nextTime, i === 0 ? 0.15 : 0.1);
      if (i === 0 || i === 4) tone(N(chord[0] - 12), nextTime, EIGHTH * 3.5, { gain: 0.16 });

      nextTime += EIGHTH; step++;

    get muted() { return muted; },

    miss: () => fx((t) => {

    alarm: () => fx((t) => { tone(N(88), t, 0.08, { type: "square", gain: 0.07, out: master }); tone(N(88), t + 0.12, 0.08, { type: "square", gain: 0.07, out: master }); }),

  const [h0, a] = SKY_KEYS[i], [h1, b] = SKY_KEYS[i + 1];
  const k = THREE.MathUtils.clamp((h - h0) / (h1 - h0 || 1), 0, 1);
  const col = (x, y) => new THREE.Color(x).lerp(new THREE.Color(y), k);
  const num = (x, y) => x + (y - x) * k;
  const hz = col(a.hz, b.hz);
  sky.material.uniforms.top.value.copy(col(a.top, b.top));
  sky.material.uniforms.horizon.value.copy(hz);
  scene.fog.color.copy(hz);
  sea.material.color.copy(col(a.sea, b.sea));
  sun.color.copy(col(a.sun, b.sun));
  sun.intensity = num(a.sunI, b.sunI);
  hemi.intensity = num(a.hemiI, b.hemiI);
  nightLevel = num(a.night, b.night);
  const day = THREE.MathUtils.clamp((h - 6) / 12, 0, 1);
  const el = nightLevel > 0.8 ? 0.9 : Math.sin(day * Math.PI) * 0.9 + 0.25;
  sun.position.set(-50 * Math.cos(day * Math.PI), 20 + el * 30, 26);
  stars.material.opacity = Math.max(0, nightLevel - 0.3) * 1.2;
  M.lamp.emissiveIntensity = 0.6 + nightLevel * 2.2;
  document.body.classList.toggle("night", nightLevel > 0.55);
  const c = hz.clone().convertLinearToSRGB();
  document.documentElement.style.setProperty("--veil-rgb", `${Math.round(c.r * 255)},${Math.round(c.g * 255)},${Math.round(c.b * 255)}`);
}

function house(w, d, h) {

  const r = (d + 0.5) / Math.sqrt(3);

  roofGeo.rotateZ(Math.PI / 2);
  roofGeo.rotateX(-Math.PI / 2);
  const roof = shadowed(new THREE.Mesh(roofGeo, pick(M.roof)));

  const door = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.72, 0.06), M.trim);

    const frame = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.46, 0.05), M.trim);

function bridgeDirs(u) {

function freeAngle(a, dirs, gap) { return dirs.every((b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b))) > gap); }

  if (u.ext) {

  } else {

    const slots = [];

    const n = 0; // 房子不是重點，島上只留關鍵物品
    for (let i = 0; i < n; i++) {

      const rad = s * (u.id === "course" ? 0.5 : 0.42);

    // 樹、路燈、碼頭

      if (!freeAngle(a, dirs, 0.3)) continue;
      onTop(tree(rand() > 0.6 ? "pine" : "round"), a, s * (0.78 + rand() * 0.12));

const bridges = [];

  const a = unitById[d.from], b = unitById[d.to];
  const pa = posOf(a), pb = posOf(b);
  const dir = pb.clone().sub(pa).setY(0).normalize();
  const side = new THREE.Vector3(-dir.z, 0, dir.x);
  const pair = DEALS.some((o) => o.from === d.to && o.to === d.from);
  const off = pair ? 1.25 : 0;
  const start = pa.clone().addScaledVector(dir, a.size * 0.95).addScaledVector(side, off).setY(0.78);
  const end = pb.clone().addScaledVector(dir, -b.size * 0.95).addScaledVector(side, off).setY(0.78);
  const mid = start.clone().lerp(end, 0.5).addScaledVector(side, off * 0.8);
  mid.y = 1.7;
  const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
  const len = curve.getLength();
  const color = new THREE.Color(a.ext ? b.color : a.color);

  const group = new THREE.Group();
  const deckMat = mat("#b98a5e", { transparent: true, roughness: 0.9 });
  const railMat = mat("#7a5a3e", { transparent: true, emissive: color, emissiveIntensity: 0 });
  const planks = Math.max(10, Math.round(len / 0.5));
  for (let k = 0; k <= planks; k++) {
    if (d.unknown && k % 3 !== 0) continue;
    const t = k / planks;
    const p = curve.getPointAt(t);
    const plank = shadowed(new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.1, 0.36), deckMat));
    plank.position.copy(p);
    plank.lookAt(p.clone().add(curve.getTangentAt(t)));
    group.add(plank);
  }
  if (false) {
    for (const s of [-0.88, 0.88]) {
      const pts = curve.getSpacedPoints(40).map((p, k, arr) => {
        const tan = curve.getTangentAt(k / (arr.length - 1));
        return p.clone().addScaledVector(new THREE.Vector3(-tan.z, 0, tan.x).normalize(), s).setY(p.y + 0.42);
      });
      group.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, 0.05, 5), railMat));
      for (let k = 0; k <= 8; k++) {
        const p = pts[Math.round((k / 8) * (pts.length - 1))];
        const post = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.45, 5), railMat));
        post.position.copy(p).setY(p.y - 0.21);
        group.add(post);
      }
    }
  }
  scene.add(group);

  const el = document.createElement("div");
  el.className = "brl off";
  el.style.borderLeftColor = color.getStyle();
  el.textContent = d.unknown ? `${d.what}・方向待確認` : d.what;
  const label = new CSS2DObject(el);
  label.position.copy(curve.getPointAt(0.5)).add(new THREE.Vector3(0, 1.6, 0));
  scene.add(label);
  bridges.push({ deal: d, curve, len, group, deckMat, railMat, el, color, glow: 0, glowTo: 0, delay: 0 });
});

const check = { on: false, i: 0, phase: "fly", t: 0, from: new THREE.Vector3(), done: null };
function startCheck(onDone, fast = false, keepBot = false, plan = false) {
  check.fast = fast;

function showCheckCaption() {
  const b = bridges[Math.min(check.i, bridges.length - 1)];
  const st = b.checked;
  if (check.plan) {
    const okN = bridges.filter((x) => x.checked === "ok").length;
    const head = `<span class="chip"><i style="background:${OK}"></i>AllWill 檢查約定</span><span class="count">${Math.min(check.i + 1, bridges.length)} / ${bridges.length}</span>`;
    if (st && st !== "ok" && b.deal.planQuote) {
      setCaption(CHECK_COLOR[st], head, `${route(b.deal)}<b style="color:${CHECK_COLOR[st]}">　對不上</b>`,
        `<div class="vs"><div><span>Plan 想要</span>${b.deal.planQuote}</div><div><span>約定原文</span>${b.deal.contractQuote}</div></div><div class="small">已沒發現問題 ${okN} 份</div>`, false);
    } else if (st && st !== "ok") {
      setCaption(CHECK_COLOR[st], head, `${route(b.deal)}<b style="color:${CHECK_COLOR[st]}">　${CHECK_TEXT[st]}</b>`, `${b.deal.body}<div class="small">已沒發現問題 ${okN} 份</div>`, false);
    } else {
      setCaption(OK, head, `沒發現問題 ${okN} 份`, "約定要定期檢查，改動時也要檢查。", false, true);
    }
    return;
  }
  setCaption(OK, `<span class="chip"><i style="background:${OK}"></i>AllWill</span><span class="count">${Math.min(check.i + 1, bridges.length)} / ${bridges.length}</span>`,
    `${route(b.deal)}`, st ? (st !== "ok" ? `<b style="color:${CHECK_COLOR[st]}">${CHECK_TEXT[st]}</b>：${b.deal.body}` : `<b style="color:${OK}">沒發現問題</b>`) : "約定要定期檢查，改動時也要檢查。", false, true);
}
function checkSummary() {
  const open = bridges.filter((b) => b.checked === "open"), gap = bridges.filter((b) => b.checked === "gap");

  caption.style.setProperty("--bar", bar);
  const count = withCount && touring ? `<span class="count">${stepIndex + 1} / ${STEPS.length}</span>` : "";
  const html = `<div class="top">${top}${count}</div><div class="big">${big}</div>${small ? `<div class="small">${small}</div>` : ""}${SOURCE ? `<div class="src">${SOURCE}</div>` : ""}`;
  if (quiet && caption.querySelector(".swap")) { caption.querySelector(".swap").innerHTML = html; return; }
  caption.classList.remove("chat-mode");
  caption.innerHTML = `<button class="cap-close" type="button" aria-label="收起說明">×</button><div class="swap">${html}</div>`;
}

function highlight(activeIds, units, stagger = 0) {
  const set = activeIds ? new Set(activeIds) : null;
  let order = 0;
  bridges.forEach((b) => {
    const on = !set || set.has(b.deal.id);
    b.deckMat.opacity = on ? 1 : 0.12;
    b.railMat.opacity = on ? 1 : 0.3;
    if (!b.checked) b.glowTo = set && on ? 1 : 0;
    b.delay = set && on ? (order++) * stagger : 0;
    b.el.classList.toggle("off", !(set && on && set.size <= 2));
  });
  Object.values(islands).forEach(({ unit, el }) => el.classList.toggle("dim", !!units && !units.includes(unit.id)));
}

function applyStep() {
  const s = STEPS[stepIndex];
  endHandoff();
  roamFrozen = false;
  buildGoal = s.build;
  if (s.kind !== "voyage") resetVoyage();
  if (stepIndex === 0) resetBuild();
  actsPaused = ["gather", "done", "voyage"].includes(s.kind);
  if (!actsPaused) Object.values(ACT).forEach((r) => r && (r.placed = false));
  document.body.classList.toggle("focus", s.kind !== "intro");
  document.body.classList.toggle("sailing", s.kind === "voyage");
  const say = (k, extra = "") => setCaption(TEAL_C, extra, CARD[k][0], CARD[k][1]);
  if (s.kind === "intro") {
    overviewView(); highlight(null, null); say("intro");
  } else if (s.kind === "focus") {
    const u = unitById[s.id];
    u.members.forEach((k, i) => bringHome(MEMBERS[k].av, s.id, i));
    if (s.id === "raymond") bringHome("ben", "raymond", 1);
    if (s.id === "jc") love.cool = 0.5;
    focusIsland(u);
    highlight(DEALS.filter((d) => d.from === s.id || d.to === s.id).map((d) => d.id), null);
    setCaption(u.color, miniCard(u.members.concat(s.id === "raymond" ? ["ben"] : [])), CARD[s.id][0], CARD[s.id][1]);
  } else if (s.kind === "duo") {
    bringHome("ben", "ben"); focusIsland(unitById.ben);
    highlight(null, null);
    setCaption("#8a5ac6", miniCard(["ben", "ccza"]), CARD.duo[0], CARD.duo[1]);
  } else if (s.kind === "agents") {
    if (portrait()) placeCamera(new THREE.Vector3(0, 0, 1), fitDistance(17, 15), 40); else placeCamera(new THREE.Vector3(0, 0, 1), fitDistance(24, 13), 34);
    highlight(DEALS.filter((d) => d.id.startsWith("s-")).map((d) => d.id), null, 0.3);
    say("agents", `<span class="chip">Agent</span>`);
  } else if (s.kind === "gather") {
    ["coomy", "water", "richard", "raymond", "ben"].forEach((k, i) => bringHome(k, "course", i));
    focusIsland(unitById.course);
    highlight(null, null);
    say("gather", `<span class="chip">AllWill</span>`);
  } else if (s.kind === "done") {
    roamFrozen = true;
    roamers.forEach((r, i) => { r.g.position.copy(big.localToWorld(new THREE.Vector3(-4 + (i % 4) * 2.4, 1.85, i < 4 ? -1.2 : 1.2))); r.g.rotation.y = big.rotation.y - Math.PI / 2; });
    if (portrait()) placeCamera(new THREE.Vector3(0, 3, 2), fitDistance(14, 12), 28); else placeCamera(new THREE.Vector3(0, 3, 2), fitDistance(18, 10), 24);
    highlight(null, null);
    say("done", `<span class="chip">AllWill</span>`);
  } else {
    voy.mode = "sail"; voy.t = 0;
    roamFrozen = true;
    highlight(null, null);
    setCaption(TEAL_C, `<span class="chip">#AllWill</span>`, "去看看，地平線後面有什麼。",
      `遠方有美國、有日本，也有還沒畫進地圖的島。我們正在出發。<br><a class="go" href="mailto:hi@specformula.ai">想一起看看地平線後面？寫信給我們：hi@specformula.ai</a><br>${ALLWILL_LINK}`);
  }
}

const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", (e) => {
  if (GAME_PAGE) return;
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const targets = [...bridges.map((b) => b.group), ...Object.values(islands).map((i) => i.group)];
  const hit = ray.intersectObjects(targets, true)[0];
  if (!hit) return;
  if (touring) setMode(false);
  if (check.on) return;
  let o = hit.object;
  while (o && !targets.includes(o)) o = o.parent;
  const br = bridges.find((b) => b.group === o);
  if (br) return showDeal(br);
  const isl = Object.values(islands).find((i) => i.group === o);
  if (isl) showIsland(isl.unit);
});
function followGoal(dt, rate) {
  const k = 1 - Math.exp(-dt * rate);
  camera.position.lerp(camGoal.pos, k);
  controls.target.lerp(camGoal.target, k);
}

function tickCave(dt) {

  const warn = G.warn ? (G.warn.type === "y" ? "#ffd23f" : "#ff5a3c") : "#8ff5e4";
  eyeMat.color.set(G.warn && Math.sin(elapsed * 30) < -0.3 ? "#ffffff" : warn);

function tickFx(dt) {
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), s = V3();
  let dirty = false;
  for (let i = 0; i < PART_N; i++) {
    const d = pdata[i];
    if (d.life <= 0) continue;
    d.life -= dt; dirty = true;
    d.v.y -= 9 * dt;
    d.p.addScaledVector(d.v, dt);
    const k = Math.max(0, d.life / d.max) * d.s;
    e.set(elapsed * 7 + i, elapsed * 5, 0); q.setFromEuler(e); s.setScalar(k);
    m.compose(d.p, q, s);
    parts.setMatrixAt(i, m);
  }
  if (dirty) parts.instanceMatrix.needsUpdate = true;
  for (const w of rings) {
    if (w.t >= 1) continue;
    w.t = Math.min(1, w.t + dt / w.dur);
    const k = 1 - Math.pow(1 - w.t, 3);
    w.m.scale.setScalar(0.3 + k * w.r);
    w.m.material.opacity = 1 - w.t;
    if (w.t >= 1) w.m.visible = false;
  }
  for (const a of avPops) {
    if (a.t >= 1) continue;

    if (a.t > 0.7) a.el.classList.add("off");
    if (a.t >= 1) a.o.visible = false;

  for (const f of floats) {
    if (f.t >= 1) continue;
    f.t = Math.min(1, f.t + dt / 1.3);
    f.o.position.y = f.y + f.t * 1.4;

    if (f.t >= 1) f.o.visible = false;
  }
}

function clampLabels() {

    const shift = x - w / 2 < 8 ? 8 - (x - w / 2) : x + w / 2 > W - 8 ? W - 8 - (x + w / 2) : 0;
    if (shift) el.style.transform += ` translateX(${shift}px)`;

}

  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (touring && !["check", "handoff", "done", "voyage"].includes(STEPS[stepIndex].kind)) applyStep();
  if (GAME_PAGE && typeof gameView === "function" && !G.sailing && !G.tut && !G.seq) gameView();
}
addEventListener("resize", resize);
resize();
// 開場：錄影模式直接從近景拉遠開始播；一般模式停在全貌，等使用者按播放
if (!params.has("rec")) {
  overviewView();
  camera.position.copy(camGoal.pos);
  controls.target.copy(camGoal.target);
  exploreHint();
  document.body.classList.add("cap-hidden");
  syncButtons();
} else {
  const m = bridges[0].curve.getPointAt(0.45);
  controls.target.copy(m);
  camera.position.copy(m).add(new THREE.Vector3(2.5, 3.2, 6.5));
}

const clock = new THREE.Clock();
let elapsed = 0;
function tick(dt) {
  elapsed += dt;
  waveSea(elapsed);
  if (!params.has("rec")) tunePerf(dt);

  if (touring) {
    stepTime += dt;
    const s = STEPS[stepIndex];
    if (s.sec && stepTime > s.sec) nextStep();
    if (s.kind === "handoff" && ho.t > HO_END) nextStep();
    followGoal(dt, firstPass && stepIndex === 0 ? 0.9 : 1.5);
  } else if (manualFocus > 0) {
    manualFocus -= dt;
    followGoal(dt, 2);
  }
  tickCheck(dt);
  tickSpecs(dt);
  tickLandmarks(dt);
  tickHobby(dt);
  for (const w of waves) { w.m.position.y = -0.15 + Math.sin(elapsed * 1.2 + w.ph) * 0.08; w.m.material.opacity = 0.45 + Math.sin(elapsed * 0.8 + w.ph) * 0.3; }
  if (beam) { beam.rotation.y += dt * 0.9; beam.visible = nightLevel > 0.3; }
  tickRoam(dt);
  tickLove(dt);
  tickActs(dt);
  tickGame(dt);
  if (touring) tickHandoff(dt);
  if (robot.visible) {
    robot.userData.ring.scale.setScalar(1 + Math.sin(elapsed * 5) * 0.12);
    robot.children[0].position.y = 0.9 + Math.sin(elapsed * 4) * 0.06;
  }

  for (const b of bridges) {
    if (b.delay > 0) { b.delay -= dt; continue; }
    b.glow += (b.glowTo - b.glow) * (1 - Math.exp(-dt * 6));
    b.railMat.emissiveIntensity = b.glow * 0.9;
  }
  for (const w of walkers) {
    w.t += (w.dir * w.speed * dt) / w.br.len;
    if (w.t >= 1) { w.t = 1; w.dir = -1; if (w.br.deal.to === "course" && !touring) buildGoal = Math.min(1, buildGoal + 0.008); }
    if (w.t <= 0) { w.t = 0; w.dir = 1; }
    w.box.visible = w.dir === 1; // 去程搬箱子，回程空手
    const t = THREE.MathUtils.clamp(w.t, 0.001, 0.999);
    const p = w.br.curve.getPointAt(t);
    const tan = w.br.curve.getTangentAt(t).multiplyScalar(w.dir);
    const sd = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
    const step = elapsed * 9 + w.phase;
    w.g.position.copy(p).addScaledVector(sd, 0.42).setY(p.y + 0.06 + Math.abs(Math.sin(step)) * 0.08);
    w.g.rotation.y = Math.atan2(tan.x, tan.z);
    w.legs[0].rotation.x = Math.sin(step) * 0.6;
    w.legs[1].rotation.x = -Math.sin(step) * 0.6;
    w.legs[2].rotation.x = -Math.sin(step) * 0.6;
    w.legs[3].rotation.x = Math.sin(step) * 0.6;
  }
  for (const w of idlers) {
    w.a += (w.speed * dt) / (w.rad * 0.25);
    const step = elapsed * 7 + w.phase;
    w.g.position.set(w.center.x + Math.cos(w.a) * w.rad, 0.75 + Math.abs(Math.sin(step)) * 0.06, w.center.z + Math.sin(w.a) * w.rad);
    const s = Math.sign(w.speed);
    w.g.rotation.y = Math.atan2(-Math.sin(w.a) * s, Math.cos(w.a) * s);
    w.legs[0].rotation.x = Math.sin(step) * 0.5;
    w.legs[1].rotation.x = -Math.sin(step) * 0.5;
    w.legs[2].rotation.x = -Math.sin(step) * 0.5;
    w.legs[3].rotation.x = Math.sin(step) * 0.5;
  }
  if (mascots.water) {
    mascots.water.scale.set(1.4 * (1 + Math.sin(elapsed * 4.4) * 0.03), 1.4 * (1 - Math.sin(elapsed * 4.4) * 0.03), 1.4);
    if (coomyBusy) {} else if (!love.hug && !(roamers.find((r) => r.me) || {}).moving) mascots.wave.rotation.z = 2.5 + Math.sin(elapsed * 6) * 0.35;
    else if (!love.hug) mascots.wave.rotation.z = 0.2;
  }
  for (const f of foams) { const k = 1 + Math.sin(elapsed * 1.2) * 0.025; f.scale.set(k, k, 1); f.material.opacity = 0.55 + Math.sin(elapsed * 1.2) * 0.15; }
  for (const f of flags) f.userData.cloth.rotation.y = Math.sin(elapsed * 2.4 + f.position.x) * 0.25;
  for (const c of clouds) { c.g.position.x += c.v * dt; if (c.g.position.x > 90) c.g.position.x = -90; }

  if (mascots.tags) { const near = camera.position.distanceTo(islands.course.group.position) < 70; mascots.tags.forEach((t) => (t.visible = near)); }
  controls.update();
  const shakeOff = shakeCamera(dt);
  const camDist = camera.position.distanceTo(controls.target);
  scene.fog.near = voy.mode === "sail" ? 90 : camDist * 1.2;
  scene.fog.far = voy.mode === "sail" ? 520 : camDist * 3.4 + 60;
  if (!params.has("fast")) { if (!window.__norender) renderer.render(scene, camera); labelRenderer.render(scene, camera); clampLabels(); }
  camera.position.sub(shakeOff);
}
if (params.has("rec")) { window.__frame = (dt) => tick(dt); window.__avatars = avatars; window.__G = G; }
else renderer.setAnimationLoop(() => tick(Math.min(clock.getDelta(), 0.05)));
</script>
</body>
</html>
