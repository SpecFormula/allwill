// ── 聲音：Web Audio 現場合成的背景音樂與音效（不用外部音檔）──
const sound = (() => {
  let ctx = null, master = null, musicGain = null, timer = null, nextTime = 0, step = 0;
  let muted = false;
  try { muted = localStorage.getItem("org-island-muted") === "1"; } catch {}
  const BPM = 100, EIGHTH = 60 / BPM / 2;
  const N = (m) => 440 * Math.pow(2, (m - 69) / 12);
  // C – Am – F – G，每個和弦一小節（8 個八分音符）
  const CHORDS = [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]];
  const ARP = [0, 1, 2, 1, 3, 2, 1, 2]; // 3＝高八度的根音
  function init() {
    if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.55;
    master.connect(comp).connect(ctx.destination);
    musicGain = ctx.createGain();
    musicGain.gain.value = 0.55;
    musicGain.connect(master);
    nextTime = ctx.currentTime + 0.1;
    timer = setInterval(schedule, 50);
  }
  function tone(freq, t, dur, { type = "sine", gain = 0.2, attack = 0.005, out = musicGain, detune = 0 } = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq; o.detune.value = detune;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(out);
    o.start(t); o.stop(t + dur + 0.05);
    return o;
  }
  function pluck(freq, t, gain = 0.16, out = musicGain) {
    // 拇指琴：基音＋短促的高泛音
    tone(freq, t, 0.9, { gain, out });
    tone(freq * 3, t, 0.18, { gain: gain * 0.25, out });
    tone(freq, t, 0.6, { type: "triangle", gain: gain * 0.35, out, detune: 6 });
  }
  let noiseBuf = null;
  function noise(t, dur, { gain = 0.05, freq = 6000, q = 1, type = "highpass", out = musicGain, sweepTo = null } = {}) {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(out);
    src.start(t); src.stop(t + dur + 0.05);
  }
  function schedule() {
    while (nextTime < ctx.currentTime + 0.25) {
      const bar = Math.floor(step / 8) % 4, i = step % 8;
      const chord = CHORDS[bar];
      const n = ARP[i] === 3 ? chord[0] + 12 : chord[ARP[i]];
      if (!(i === 7 && bar % 2 === 1)) pluck(N(n + 12), nextTime, i === 0 ? 0.15 : 0.1);
      if (i === 0 || i === 4) tone(N(chord[0] - 12), nextTime, EIGHTH * 3.5, { gain: 0.16 });
      if (i === 0) chord.forEach((m) => tone(N(m), nextTime, EIGHTH * 8, { type: "triangle", gain: 0.025, attack: 0.4 }));
      if (i % 2 === 1) noise(nextTime, 0.06, { gain: 0.025 });
      nextTime += EIGHTH; step++;
    }
  }
  const now = () => ctx.currentTime + 0.01;
  const fx = (fn) => { if (ctx && !muted) fn(now()); };
  return {
    start: init,
    get muted() { return muted; },
    toggle() {
      init();
      muted = !muted;
      try { localStorage.setItem("org-island-muted", muted ? "1" : "0"); } catch {}
      if (master) master.gain.setTargetAtTime(muted ? 0 : 0.55, ctx.currentTime, 0.05);
      return muted;
    },
    whoosh: () => fx((t) => noise(t, 0.5, { gain: 0.12, type: "bandpass", freq: 600, q: 2, sweepTo: 3200, out: master })),
    ok: () => fx((t) => { tone(N(88), t, 0.35, { gain: 0.09, out: master }); tone(N(95), t + 0.06, 0.3, { gain: 0.05, out: master }); }),
    bad: () => fx((t) => { tone(N(57), t, 0.18, { type: "triangle", gain: 0.16, out: master }); tone(N(56), t + 0.16, 0.25, { type: "triangle", gain: 0.16, out: master }); }),
    pop: () => fx((t) => { const o = tone(N(72), t, 0.18, { gain: 0.14, out: master }); o.frequency.exponentialRampToValueAtTime(N(84), t + 0.1); }),
    answer: () => fx((t) => [72, 76, 79].forEach((m, k) => pluck(N(m), t + k * 0.07, 0.12, master))),
    sparkle: () => fx((t) => [72, 76, 79, 84, 88].forEach((m, k) => pluck(N(m), t + k * 0.08, 0.1, master))),
  };
})();

const perf = { acc: 0, n: 0 };
function tunePerf(dt) {
  perf.acc += dt; perf.n++;
  if (perf.n < 45) return;
  const avg = perf.acc / perf.n; perf.acc = 0; perf.n = 0;
  if (avg > 1 / 45 && pixelRatio > 1) { pixelRatio = Math.max(1, pixelRatio - 0.25); renderer.setPixelRatio(pixelRatio); }
  else if (avg < 1 / 58 && pixelRatio < Math.min(devicePixelRatio, 1.75) - 0.01) { pixelRatio = Math.min(Math.min(devicePixelRatio, 1.75), pixelRatio + 0.25); renderer.setPixelRatio(pixelRatio); }
}

let nightLevel = 0;
function applyDaylight() {
  const d = new Date();
  const h = hourOverride ?? (params.has("hour") ? Number(params.get("hour")) : d.getHours() + d.getMinutes() / 60);
  let i = 0;
  while (i < SKY_KEYS.length - 2 && SKY_KEYS[i + 1][0] <= h) i++;
  const [h0, a] = SKY_KEYS[i], [h1, b] = SKY_KEYS[i + 1];
  const k = THREE.MathUtils.clamp((h - h0) / (h1 - h0 || 1), 0, 1);
  const col = (x, y) => new THREE.Color(x).lerp(new THREE.Color(y), k);
  const num = (x, y) => x + (y - x) * k;
  const hz = col(a.hz, b.hz);
  sky.material.uniforms.top.value.copy(col(a.top, b.top));
  sky.material.uniforms.horizon.value.copy(hz);
  scene.fog.color.copy(hz);
  sea.material.color.copy(col(a.sea, b.sea));
  sun.color.copy(col(a.sun, b.sun));
  sun.intensity = num(a.sunI, b.sunI);
  hemi.intensity = num(a.hemiI, b.hemiI);
  nightLevel = num(a.night, b.night);
  const day = THREE.MathUtils.clamp((h - 6) / 12, 0, 1);
  const el = nightLevel > 0.8 ? 0.9 : Math.sin(day * Math.PI) * 0.9 + 0.25;
  sun.position.set(-50 * Math.cos(day * Math.PI), 20 + el * 30, 26);
  stars.material.opacity = Math.max(0, nightLevel - 0.3) * 1.2;
  M.lamp.emissiveIntensity = 0.6 + nightLevel * 2.2;
  document.body.classList.toggle("night", nightLevel > 0.55);
  const c = hz.clone().convertLinearToSRGB();
  document.documentElement.style.setProperty("--veil-rgb", `${Math.round(c.r * 255)},${Math.round(c.g * 255)},${Math.round(c.b * 255)}`);
}

function house(w, d, h) {

  // 斜屋頂（三角柱），兩側挑出屋簷
  const r = (d + 0.5) / Math.sqrt(3);
  const roofGeo = new THREE.CylinderGeometry(r, r, w + 0.4, 3);
  roofGeo.rotateZ(Math.PI / 2);

  const roof = shadowed(new THREE.Mesh(roofGeo, pick(M.roof)));
  roof.position.y = h + 0.1 + r * 0.5;
  g.add(skirt, wall, roof);
  // 門與窗框

function bridgeDirs(u) {
  // 這座島上橋頭的方向，建物與碼頭避開
  return DEALS.filter((d) => d.from === u.id || d.to === u.id).map((d) => {
    const other = unitById[d.from === u.id ? d.to : d.from];
    const v = posOf(other).sub(posOf(u));
    return Math.atan2(v.z, v.x);
  });
}
function freeAngle(a, dirs, gap) { return dirs.every((b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b))) > gap); }

  if (u.ext) {

    for (let i = 0; i < n; i++) {

    if (st && st !== "ok" && b.deal.planQuote) {
      setCaption(CHECK_COLOR[st], head, `${route(b.deal)}<b style="color:${CHECK_COLOR[st]}">　對不上</b>`,
        `<div class="vs"><div><span>Plan 想要</span>${b.deal.planQuote}</div><div><span>約定原文</span>${b.deal.contractQuote}</div></div><div class="small">已沒發現問題 ${okN} 份</div>`, false);
    } else if (st && st !== "ok") {

    } else {

    }

  }

    `${route(b.deal)}`, st ? (st !== "ok" ? `<b style="color:${CHECK_COLOR[st]}">${CHECK_TEXT[st]}</b>：${b.deal.body}` : `<b style="color:${OK}">沒發現問題</b>`) : "約定要定期檢查，改動時也要檢查。", false, true);
}
function checkSummary() {

  const ok = bridges.length - open.length - gap.length;
  const who = [...open, ...gap].map((b) => `<li><span class="dot" style="background:${CHECK_COLOR[b.checked]}"></span>${route(b.deal)}<span class="who">找${owners(b.deal)}</span></li>`).join("");
  setCaption(OK, `<span class="chip">檢查結果</span>`,
    `${bridges.length} 份約定：${ok} 份沒發現問題、${open.length} 份待釐清、${gap.length} 份待補`,
    `<ul class="who-list">${who}</ul>`, false);
}
function tickCheck(dt) {
  robot.userData.labelObj.visible = robot.visible; // CSS2D 標籤不跟父物件隱藏
  if (!check.on) return;
  placeCamera(robot.position.clone().setY(0).add(new THREE.Vector3(0, 0, portrait() ? 3 : 1.5)), fitDistance(13, 11), portrait() ? 44 : 38);
  if (!touring) manualFocus = 0.5;
  const b = bridges[check.i];
  const start = b.curve.getPointAt(0).clone().setY(b.curve.getPointAt(0).y + 0.1);
  if (check.phase === "fly") {
    check.t += dt / (check.plan && !b.deal.check ? 0.18 : check.fast ? 0.22 : 0.4);
    const k = Math.min(check.t, 1);
    robot.position.lerpVectors(check.from, start, k);
    robot.position.y += Math.sin(k * Math.PI) * 3;
    if (check.t >= 1) { check.phase = "walk"; check.t = 0; }
  } else if (check.phase === "walk") {
    check.t += dt / (b.deal.check ? (check.fast ? 0.7 : 1.1) : check.fast || check.plan ? 0.22 : 0.6);
    const k = Math.min(check.t, 1);
    const p = b.curve.getPointAt(k);
    robot.position.copy(p).setY(p.y + 0.1);
    const tan = b.curve.getTangentAt(k);
    robot.rotation.y = Math.atan2(tan.x, tan.z);
    if (check.t >= 0.5 && b.checked === null) { markChecked(b); setBotColor(CHECK_COLOR[b.checked]); showCheckCaption(); }
    if (check.t >= 1) { check.phase = b.checked === "ok" ? "next" : "hold"; check.t = 0; }
  } else if (check.phase === "hold") {
    check.t += dt / (check.plan ? 3.2 : check.fast ? 0.9 : 1.2);
    if (check.t >= 1) check.phase = "next";
  } else {
    setBotColor(OK);
    check.from.copy(robot.position);
    check.i += 1; check.t = 0; check.phase = "fly";
    if (check.i >= bridges.length) {
      check.on = false;
      robot.visible = check.keepBot;
      checkSummary();
      if (check.done) check.done();
    } else showCheckCaption();
  }
}

  if (!me || !wb || voy.mode === "sail" || roamFrozen) { heart.el.classList.add("off"); return; }
  const fwd = new THREE.Vector3(Math.sin(me.g.rotation.y), 0, Math.cos(me.g.rotation.y));
  const side = new THREE.Vector3(fwd.z, 0, -fwd.x);
  // 走路時跟在後面（過橋也不會掉下去），停下來時站到旁邊
  const goal = me.g.position.clone().add(me.moving || me.mode === "cross" ? fwd.clone().multiplyScalar(-1.1) : side.clone().multiplyScalar(1.05));
  const d = goal.clone().sub(wb.g.position).setY(0);
  wb.g.position.x += d.x * (1 - Math.exp(-dt * 3));
  wb.g.position.z += d.z * (1 - Math.exp(-dt * 3));

function tickFinale(dt) {
  fin.t += dt;
  if (fin.t < 2.6) { const a = -0.9 + fin.t * 0.7, r = portrait() ? 26 : 20; camGoal.target.copy(YARD).add(V(0, 4, 0)); camGoal.pos.copy(YARD).add(V(Math.sin(a) * r, 9, Math.cos(a) * r)); }
  if (fin.t > 2.6 && !fin.pulled) { fin.pulled = true; overviewView(); }
  if (fin.t > 3 && fin.t < 6.5) { const k = THREE.MathUtils.smoothstep(fin.t, 3, 6.5); hourOverride = fin.h0 + (21.5 - fin.h0 + (fin.h0 > 21.5 ? 24 : 0)) * k; if (hourOverride >= 24) hourOverride -= 24; applyDaylight(); }
  bridges.forEach((b) => { b.deckMat.emissive.copy(b.color); b.deckMat.emissiveIntensity = nightLevel * 0.22; });
  if (fin.t > 7 && !fin.said) { fin.said = true; robotFx.blink = -0.05; robotFx.flash = 1.2; sayB(BUB.allwill, "明天見！", 3); }
}
function endNight() {
  hourOverride = null; applyDaylight();
  bridges.forEach((b) => { b.deckMat.emissiveIntensity = 0; });
}
function nextStep() {
  if (stepIndex + 1 >= STEPS.length && !params.has("rec")) { touring = false; setMode(false); return; } // 播完停在夜晚的島上，切成自己逛
  stepTime = 0; stepIndex = (stepIndex + 1) % STEPS.length; if (stepIndex === 0) firstPass = false; applyStep();
}

// ── 自己逛：點島看功能、點橋看約定 ──
const tourBtn = document.getElementById("tourBtn");
const exploreBtn = document.getElementById("exploreBtn");
const checkBtn = document.getElementById("checkBtn");
function syncButtons() {
  document.body.classList.toggle("playing", touring);
  tourBtn.textContent = touring || played ? "↻ 重播" : "▶ 播放";
  tourBtn.classList.toggle("on", touring);
  exploreBtn.classList.toggle("on", !touring && exploring);
}
let played = false, exploring = false;
function startTour() {
  endNight(); resetShow();
  if (!params.has("rec")) sound.start();
  played = true; exploring = false;
  touring = true;
  endHandoff();
  check.on = false; robot.visible = false; stepIndex = 0; stepTime = 0; firstPass = true;
  document.body.classList.remove("cap-hidden");
  // 從小人近景拉遠開場
  const m = bridges[0].curve.getPointAt(0.45);
  controls.target.copy(m);
  camera.position.copy(m).add(new THREE.Vector3(2.5, 3.2, 6.5));
  applyStep();
  syncButtons();
}
function setMode(tour) {
  if (tour) return startTour();
  document.body.classList.add("has-played");
  if (!params.has("rec")) sound.start();
  touring = false; exploring = true;
  endHandoff();
  document.body.classList.remove("cap-hidden");
  if (!check.on) exploreHint();
  syncButtons();
}
document.getElementById("playCta").addEventListener("click", startTour);
const soundBtn = document.getElementById("soundBtn");
const syncSound = () => { soundBtn.textContent = sound.muted ? "🔇" : "🔊"; };
syncSound();
soundBtn.addEventListener("click", () => { sound.toggle(); syncSound(); });
function exploreHint() {
  current = null;
  document.body.classList.remove("focus");
  highlight(null, null);
  setCaption(OK, `<span class="chip">自己逛</span>`, "點點看島上的人", `點橋上頭上有 ? 的 Agent 親手解掉矛盾，或戳一下中間的 AllWill。<div class="end-btns">${GAME_BTN}${MAIL_BTN}</div>${ALLWILL_LINK}`, false);
}
tourBtn.addEventListener("click", startTour);
exploreBtn.addEventListener("click", () => setMode(false));
checkBtn.addEventListener("click", () => {
  sound.start();
  if (touring) setMode(false);
  // 重新開一局：船身保留，金磚、裝飾、霓虹清空，所有 Agent 都帶著衝突
  resetShow(); freePlay = true; play.solves = 0;
  savedView = null;
  if (portrait()) placeCamera(new THREE.Vector3(0, 0, 3), fitDistance(20, 24), 62); else placeCamera(new THREE.Vector3(0, 0, 4), fitDistance(30, 22), 50);
  manualFocus = 2.5;
  document.body.classList.add("play-hint");
  document.body.classList.remove("cap-hidden");
  playCaption(false);
});
controls.addEventListener("start", () => { if (touring && !interactiveStep()) setMode(false); });

// 點島、點橋、點成員前先記住視角；關掉說明卡就回到原本的視角
let savedView = null;
function rememberView() {
  document.body.classList.remove("cap-hidden"); // 卡片收起後再點島，要重新打開
  if (!savedView && !touring) savedView = { pos: camera.position.clone(), target: controls.target.clone() };
}
function restoreView() {
  if (!savedView) return;
  camGoal.pos.copy(savedView.pos); camGoal.target.copy(savedView.target); manualFocus = 1.8;
  savedView = null; current = null;
  document.body.classList.remove("focus");
  highlight(null, null);
  showTags([]);
}
function showIsland(u) {
  rememberView();
  if (u.members) {
    current = { type: "island", id: u.id };
    document.body.classList.add("focus");
    focusIsland(u); manualFocus = 2.5;
    highlight(DEALS.filter((d) => d.from === u.id || d.to === u.id).map((d) => d.id), null);
    return setCaption(u.color, `<span class="chip"><i style="background:${u.color}"></i>${u.name}</span>`, "", islandCard(u), false);
  }
  if (u.id === "course") {
    document.body.classList.add("focus");
    focusIsland(u); manualFocus = 2.5;
    return setCaption("#15171c", `<span class="chip">AllWill</span>`, "我們正在打造的 AllWill", `大家的 Spec 送進來對一對，衝突、矛盾的地方丟給負責的人解掉。讓不同專業的人與 AI 共同規劃，讓 Plan、規格與知識持續同步。<br>${GAME_LINK}`, false);
  }
  if (u.id === "allwill") {
    document.body.classList.add("focus");
    focusIsland(u); manualFocus = 2.5;
    return setCaption("#14b89c", `<span class="chip">AllWill</span>`, "我們正在打造的產品", `讓不同專業的人與 AI 共同規劃，讓 Plan、規格與知識持續同步。<br>${ALLWILL_LINK}`, false);
  }
  current = { type: "island", id: u.id };
  document.body.classList.add("focus");
  focusIsland(u); manualFocus = 2.5;
  const out = DEALS.filter((d) => d.from === u.id), inn = DEALS.filter((d) => d.to === u.id);
  highlight([...out, ...inn].map((d) => d.id), [u.id, ...out.map((d) => d.to), ...inn.map((d) => d.from)]);
  const dealChip = (d, other) => `<button class="deal" data-deal="${d.id}">${chip(unitById[other])}<span>${d.what}</span></button>`;
  const feats = u.features
    ? `<div class="sec">功能區 ${u.features.length} 個（數字是規格文件數）</div><div class="feats">${u.features.map(([n, c]) => `<span>${n}<em>${c} 份</em></span>`).join("")}</div>`
    : u.id === "allwill" ? `<div class="small">AllWill 不屬於這個組織；它在旁邊檢查約定，決定還是由人來做。</div>`
    : u.ext ? `<div class="sec">外部服務</div><div class="small">範例只寫了它在約定裡的角色。</div>`
    : `<div class="sec">功能區</div><div class="small">範例裡還沒寫下這座島的規格，只有約定。</div>`;
  const deals = `${out.length ? `<div class="sec">交出 ${out.length} 份</div><div class="deals">${out.map((d) => dealChip(d, d.to)).join("")}</div>` : ""}
    ${inn.length ? `<div class="sec">收到 ${inn.length} 份</div><div class="deals">${inn.map((d) => dealChip(d, d.from)).join("")}</div>` : ""}`;
  setCaption(u.color, chip(u), u.say, `${feats}${deals}`, false);
}
function showDeal(b) {
  rememberView();
  current = { type: "deal", id: b.deal.id };
  document.body.classList.add("focus");
  focusOn([b]); manualFocus = 2.5;
  highlight([b.deal.id], [b.deal.from, b.deal.to]);
  const i = bridges.indexOf(b);
  const st = b.checked && b.checked !== "ok" ? `<b style="color:${CHECK_COLOR[b.checked]}">${CHECK_TEXT[b.checked]}</b>：找${owners(b.deal)}釐清。` : "";
  setCaption(b.deal.check === "open" ? OPEN : b.color.getStyle(),
    `${route(b.deal)}<span class="pager"><button data-step="-1" aria-label="上一份">‹</button>${i + 1} / ${bridges.length}<button data-step="1" aria-label="下一份">›</button></span>`,
    b.deal.plain, `${b.deal.body}${st ? "<br>" + st : ""}`, false);
}
document.getElementById("capOpen").addEventListener("click", () => document.body.classList.remove("cap-hidden"));
caption.addEventListener("click", (e) => {
  if (e.target.closest("[data-skip]") && touring) { nextStep(); return; }
  if (e.target.closest("[data-skip]") && freePlay) { freePlay = false; document.body.classList.remove("play-hint"); exploreHint(); return; }
  if (e.target.closest(".cap-close")) { document.body.classList.add("cap-hidden"); restoreView(); return; }
  const d = e.target.closest("[data-deal]");
  if (d) { if (touring) setMode(false); showDeal(bridgeById[d.dataset.deal]); return; }
  const s = e.target.closest("[data-step]");
  if (s && current?.type === "deal") {
    const i = bridges.indexOf(bridgeById[current.id]);
    showDeal(bridges[(i + Number(s.dataset.step) + bridges.length) % bridges.length]);
  }
});
// 卡片左右滑換下一份約定
let swipeX = null;
caption.addEventListener("pointerdown", (e) => { swipeX = e.clientX; });
caption.addEventListener("pointerup", (e) => {
  if (swipeX === null || current?.type !== "deal") return;
  const dx = e.clientX - swipeX; swipeX = null;
  if (Math.abs(dx) < 40) return;
  const i = bridges.indexOf(bridgeById[current.id]);
  showDeal(bridges[(i + (dx < 0 ? 1 : -1) + bridges.length) % bridges.length]);
});

const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  if (handleInteract()) return;
  if (touring && interactiveStep()) return; // 互動段點到別的地方不打斷
  const targets = [...bridges.map((b) => b.group), ...Object.values(islands).map((i) => i.group)];
  const hit = ray.intersectObjects(targets, true)[0];
  if (!hit) return;
  if (touring) setMode(false);
  if (check.on) return;
  let o = hit.object;
  while (o && !targets.includes(o)) o = o.parent;
  const br = bridges.find((b) => b.group === o);
  if (br) return showDeal(br);
  const isl = Object.values(islands).find((i) => i.group === o);
  if (isl) showIsland(isl.unit);
});
function followGoal(dt, rate) {
  const k = 1 - Math.exp(-dt * rate);
  camera.position.lerp(camGoal.pos, k);
  controls.target.lerp(camGoal.target, k);
}
let manualFocus = 0;

// ── 迴圈 ──
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (touring && !["check", "handoff", "done", "voyage"].includes(STEPS[stepIndex].kind)) applyStep();
}
addEventListener("resize", resize);
resize();
// 開場：錄影模式直接從近景拉遠開始播；一般模式停在全貌，等使用者按播放
if (!params.has("rec")) {
  overviewView();
  camera.position.copy(camGoal.pos);
  controls.target.copy(camGoal.target);
  exploreHint();
  document.body.classList.add("cap-hidden");
  syncButtons();
} else {
  const m = bridges[0].curve.getPointAt(0.45);
  controls.target.copy(m);
  camera.position.copy(m).add(new THREE.Vector3(2.5, 3.2, 6.5));
}

const clock = new THREE.Clock();
let elapsed = 0;
function tick(dt) {
  elapsed += dt;
  waveSea(elapsed);
  if (!params.has("rec")) tunePerf(dt);

  if (touring) {
    stepTime += dt;
    const s = STEPS[stepIndex];
    if (s.sec && stepTime > s.sec) nextStep();
    if (s.kind === "handoff" && ho.t > HO_END) nextStep();
    if (s.kind === "finale") tickFinale(dt);
    if (s.kind === "agents" && play.tutAt && stepTime > play.tutAt + 1.8) nextStep();
    if (s.kind === "play" && (play.solves || 0) >= PLAY_GOAL && stepTime > 1) nextStep();
    if (s.kind === "boss" && boss.dead && !boss.on && neon.k >= 1) nextStep();
    followGoal(dt, firstPass && stepIndex === 0 ? 0.9 : 1.5);
  } else if (manualFocus > 0) {
    manualFocus -= dt;
    followGoal(dt, 2);
  }
  tickCheck(dt);
  tickVoyage(dt);
  tickSpecs(dt);
  tickEmit(dt);
  tickLandmarks(dt);
  tickHobby(dt);
  tickRobot(dt);
  for (const w of waves) { w.m.position.y = -0.15 + Math.sin(elapsed * 1.2 + w.ph) * 0.08; w.m.material.opacity = 0.45 + Math.sin(elapsed * 0.8 + w.ph) * 0.3; }
  if (beam) { beam.rotation.y += dt * 0.9; beam.visible = nightLevel > 0.3; }
  tickRoam(dt);
  tickLove(dt);
  tickActs(dt);
  tickConflicts(dt);
  tickBoss(dt);
  tickDecos(dt);
  if (touring) tickHandoff(dt);
  if (robot.visible) {
    robot.userData.ring.scale.setScalar(1 + Math.sin(elapsed * 5) * 0.12);
    robot.children[0].position.y = 0.9 + Math.sin(elapsed * 4) * 0.06;
  }

  for (const b of bridges) {
    if (b.delay > 0) { b.delay -= dt; continue; }
    b.glow += (b.glowTo - b.glow) * (1 - Math.exp(-dt * 6));
    b.railMat.emissiveIntensity = b.glow * 0.9;
  }
  for (const w of walkers) {
    w.t += (w.dir * w.speed * dt) / w.br.len;
    if (w.t >= 1) { w.t = 1; w.dir = -1; if (w.br.deal.to === "course" && !touring) buildGoal = Math.min(1, buildGoal + 0.008); if (w.q) { robotFx.jaw = 0.45; w.solved = false; w.aimed = false; w.byUser = false; } }
    if (w.t <= 0) { w.t = 0; w.dir = 1; }
    if (w.q) {
      if (w.dir === -1 && !w.aimed && w.t < autoT() && !actsPaused && voy.mode === "home") { w.aimed = true; resolveConflict(w); }
      w.q.visible = w.dir === -1 && !w.solved && w.g.visible && (w.always || stepKind() === "play");
    }
    w.box.visible = w.dir === 1 || !!w.solved; // 去程搬箱子；解掉衝突的回程背著金色 Spec
    if (w.box.material === GOLD_SPEC && w.dir === 1 && w.t > 0.98) w.box.material = w.boxMat;
    const t = THREE.MathUtils.clamp(w.t, 0.001, 0.999);
    const p = w.br.curve.getPointAt(t);
    const tan = w.br.curve.getTangentAt(t).multiplyScalar(w.dir);
    const sd = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
    const step = elapsed * 9 + w.phase;
    w.g.position.copy(p).addScaledVector(sd, 0.42).setY(p.y + 0.06 + Math.abs(Math.sin(step)) * 0.08);
    w.g.rotation.y = Math.atan2(tan.x, tan.z);
    w.legs[0].rotation.x = Math.sin(step) * 0.6;
    w.legs[1].rotation.x = -Math.sin(step) * 0.6;
    w.legs[2].rotation.x = -Math.sin(step) * 0.6;
    w.legs[3].rotation.x = Math.sin(step) * 0.6;
  }
  for (const w of idlers) {
    w.a += (w.speed * dt) / (w.rad * 0.25);
    const step = elapsed * 7 + w.phase;
    w.g.position.set(w.center.x + Math.cos(w.a) * w.rad, 0.75 + Math.abs(Math.sin(step)) * 0.06, w.center.z + Math.sin(w.a) * w.rad);
    const s = Math.sign(w.speed);
    w.g.rotation.y = Math.atan2(-Math.sin(w.a) * s, Math.cos(w.a) * s);
    w.legs[0].rotation.x = Math.sin(step) * 0.5;
    w.legs[1].rotation.x = -Math.sin(step) * 0.5;
    w.legs[2].rotation.x = -Math.sin(step) * 0.5;
    w.legs[3].rotation.x = Math.sin(step) * 0.5;
  }
  if (mascots.water) {
    mascots.water.scale.set(1.4 * (1 + Math.sin(elapsed * 4.4) * 0.03), 1.4 * (1 - Math.sin(elapsed * 4.4) * 0.03), 1.4);
    if (coomyBusy) {} else if (!love.hug && !(roamers.find((r) => r.me) || {}).moving) mascots.wave.rotation.z = 2.5 + Math.sin(elapsed * 6) * 0.35;
    else if (!love.hug) mascots.wave.rotation.z = 0.2;
  }
  for (const f of foams) { const k = 1 + Math.sin(elapsed * 1.2) * 0.025; f.scale.set(k, k, 1); f.material.opacity = 0.55 + Math.sin(elapsed * 1.2) * 0.15; }
  for (const f of flags) f.userData.cloth.rotation.y = Math.sin(elapsed * 2.4 + f.position.x) * 0.25;
  for (const c of clouds) { c.g.position.x += c.v * dt; if (c.g.position.x > 90) c.g.position.x = -90; }

  if (mascots.tags) { const near = camera.position.distanceTo(islands.course.group.position) < 70; mascots.tags.forEach((t) => (t.visible = near)); }
  controls.update();
  const camDist = camera.position.distanceTo(controls.target);
  scene.fog.near = voy.mode === "sail" ? 90 : camDist * 1.2;
  scene.fog.far = voy.mode === "sail" ? 520 : camDist * 3.4 + 60;
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  clampLabels();
}
if (params.has("rec")) { window.__crewTest = { solve: () => walkers.filter((w) => w.q && w.q.visible && !w.aimed).forEach((w) => { w.aimed = true; w.byUser = true; resolveConflict(w); }), bossHit, state: () => ({ step: STEPS[stepIndex].kind, solves: userSolves, decoN, goldN, boss: { ...boss }, neon: neon.k }) }; window.__frame = (dt) => tick(dt); window.__avatars = avatars; }
else renderer.setAnimationLoop(() => tick(Math.min(clock.getDelta(), 0.05)));
</script>
</body>
